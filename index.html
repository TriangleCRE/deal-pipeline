/* ============================================================
   Triangle Deal Pipeline — design system
   Brand: Triangle green (#33a94d) + charcoal. Data marks use an
   accessible palette (validated). Edit tokens here to restyle globally.
   ============================================================ */
:root{
  /* brand */
  --brand:#33a94d; --brand-dark:#2b6b39; --brand-ink:#1f3d28; --brand-wash:#eef7f0;
  /* surfaces / ink */
  --page:#f6f7f4; --surface:#ffffff; --surface-2:#fbfcfa;
  --ink:#14140f; --ink-2:#52514e; --muted:#8a8880;
  --line:#e6e5df; --line-2:#efeee9;
  /* provenance markers */
  --p-source:#2a78d6;  --p-source-bg:#eaf2fc;
  --p-web:#1baf7a;     --p-web-bg:#e7f7f1;
  --p-ai:#6a4fb0;      --p-ai-bg:#f0ecfa;
  --p-need:#c77b00;    --p-need-bg:#fbf1de;
  /* status */
  --ok:#0ca30c; --ok-ink:#0a6b0a; --ok-bg:#e6f5e6;
  --warn:#c98a00; --warn-ink:#8a5f00; --warn-bg:#fbf1d8;
  --bad:#d03b3b; --bad-ink:#9a2727; --bad-bg:#fbe8e8;
  --shadow:0 1px 2px rgba(20,20,15,.05),0 8px 24px rgba(20,20,15,.06);
  --radius:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-size:15px}
a{color:var(--brand-dark);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
img{max-width:100%}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);
  backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand>a{display:inline-flex;align-items:center}
.brand>a:hover{text-decoration:none}
.brand img{height:38px;width:38px;object-fit:contain;border-radius:8px;display:block}
.brand-txt{font-weight:800;font-size:15px;letter-spacing:.02em}
.brand-txt small{display:block;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.topnav{margin-left:auto;display:flex;align-items:center;gap:6px}
.topnav a{padding:8px 14px;border-radius:9px;color:var(--ink-2);font-weight:600;font-size:14px}
.topnav a:hover{background:var(--brand-wash);color:var(--brand-dark);text-decoration:none}
.topnav a.active{background:var(--brand);color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font-weight:650;font-size:14px;padding:9px 16px;border-radius:10px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--brand);color:var(--brand-dark);text-decoration:none}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
.btn-danger{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-ink)}
.btn-danger:hover{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-sm{padding:6px 12px;font-size:13px}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 80px}
.section-title{font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:18px}

/* ---------- provenance chips ---------- */
.prov{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.6;border:1px solid transparent}
.prov .dot{width:7px;height:7px;border-radius:50%}
.prov-source{background:var(--p-source-bg);color:#1a4d8c;border-color:#cfe0f6}
.prov-source .dot{background:var(--p-source)}
.prov-web{background:var(--p-web-bg);color:#0d6b4c;border-color:#c7ebdd}
.prov-web .dot{background:var(--p-web)}
.prov-ai{background:var(--p-ai-bg);color:#4a3487;border-color:#ddd3f2}
.prov-ai .dot{background:var(--p-ai)}
.prov-need{background:var(--p-need-bg);color:#8a5600;border-color:#f0dcb0}
.prov-need .dot{background:var(--p-need)}

/* provenance legend */
.prov-legend{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.prov-legend .li{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}

/* ---------- status badges ---------- */

      hint: "5 = highly efficient fit · 1 = constrained / poor yield" },

      hint: "5 = broad buyer pool / easy exit · 1 = thin buyer pool" }

  const SCORE_CRITERIA_TENANT_DRIVEN = [
    { id: "tenantFit",      label: "Tenant Requirement Fit",   weight: 2.0,
      hint: "5 = site matches all tenant criteria · 3 = workable with tradeoffs · 1 = major gaps" },

      hint: "5 = by-right, fast timeline · 1 = rezoning/SUP required, slow" },
    { id: "executionReadiness",label:"Execution Readiness",    weight: 1.25,
      hint: "5 = site control secured, budget final · 1 = early stage" }

  const SCORE_CRITERIA_BY_TYPE = {
    "Property-Driven": SCORE_CRITERIA_PROPERTY_DRIVEN,
    "Tenant-Driven": SCORE_CRITERIA_TENANT_DRIVEN
  };
  // legacy alias — existing callers that assumed a single scorecard
  const SCORE_CRITERIA = SCORE_CRITERIA_PROPERTY_DRIVEN;
  const SCORE_WEIGHT_TOTAL = SCORE_CRITERIA.reduce((s, c) => s + c.weight, 0); // 14.5

  function scoreCriteriaFor(dealType) {
    return SCORE_CRITERIA_BY_TYPE[dealType] || SCORE_CRITERIA_PROPERTY_DRIVEN;
  }

  function computeScore(scores, dealType) {
    if (!scores) return null;
    const criteria = scoreCriteriaFor(dealType);
    const weightTotal = criteria.reduce((s, c) => s + c.weight, 0);
    let sp = 0, n = 0;
    criteria.forEach(c => {
      const v = Number(scores[c.id]);
      if (v > 0) { sp += v * c.weight; n++; }
    });
    if (n === 0) return null;
    const raw = criteria.reduce((s, c) => s + (Number(scores[c.id]) || 0), 0);
    const weighted = Math.round((sp / weightTotal) * 20 * 10) / 10;
    let status = "Pass", cls = "badge-bad", meaning = "Pass unless strategic";
    if (weighted >= 80) { status = "Advance"; cls = "badge-ok"; meaning = "Advance aggressively"; }
    else if (weighted >= 65) { status = "Keep Warm"; cls = "badge-warn"; meaning = "Keep warm / solve key issue"; }
    return { weighted, raw, rawMax: criteria.length * 5, status, cls, meaning, complete: n === criteria.length };
  }

  /* ---------- Financing summary ----------
     Derives headline deal economics from model inputs.
     Anything not directly in the model is flagged as an estimate in the UI.
  ------------------------------------------- */
  function computeFinancing(f) {
    if (!f) return null;
    const g = k => Number(f[k]) || 0;
    const num = k => (f[k] != null ? Number(f[k]) : null);

    /* ---- purchase price: canonical `purchasePrice`, legacy `landPrice` ---- */
    const purchasePrice = f.purchasePrice != null ? g("purchasePrice") : g("landPrice");

    /* ---- primary use row: canonical primaryUse*, legacy retail* ----
       Every deal has ONE dominant leasable use, whatever this asset class
       calls it (Retail, Warehouse, Units, Land, ...) — legacy retailSF /
       retailRentPSF docs still map straight onto it. */
    const primaryUseLabel = f.primaryUseLabel || (f.retailSF != null || f.retailRentPSF != null ? "Retail" : null);
    const primaryUseSF = f.primaryUseSF != null ? num("primaryUseSF") : num("retailSF");
    const primaryUseRentPSF = f.primaryUseRentPSF != null ? num("primaryUseRentPSF") : num("retailRentPSF");
    const primaryUseAreaUnit = f.primaryUseAreaUnit || "SF";
    const primaryUseRentBasis = f.primaryUseRentBasis || "/SF NNN";
    const primaryUseCostPSF = f.primaryUseCostPSF != null ? num("primaryUseCostPSF") : num("retailCostPSF");

    /* ---- secondary use(s): canonical `secondaryUses` array, legacy storage* ----
       Only present on deals that genuinely have a second use (self-storage
       bolted onto a retail pad, office SF inside an industrial building) —
       absent everywhere else, so no leftover "0 SF @ $0/SF" rows. */
    let secondaryUses = Array.isArray(f.secondaryUses) ? f.secondaryUses : [];
    if (!secondaryUses.length && (f.storageSF != null || f.storageRentPSF != null || f.storageCostPSF != null)) {
      secondaryUses = [{ label: "Self-storage", sf: f.storageSF, rentPSF: f.storageRentPSF, rentBasis: "/SF net rentable", costPSF: f.storageCostPSF }];
    }
    const secondaryUseRows = secondaryUses
      .map(u => ({
        label: (u && u.label) || null,
        sf: u && u.sf != null ? Number(u.sf) : null,
        areaUnit: (u && u.areaUnit) || "SF",
        rentPSF: u && u.rentPSF != null ? Number(u.rentPSF) : null,
        rentBasis: (u && u.rentBasis) || "/SF",
        costPSF: u && u.costPSF != null ? Number(u.costPSF) : null,
      }))
      .filter(u => u.label && (u.sf || u.rentPSF || u.costPSF));

    const primaryUseCost = primaryUseSF && primaryUseCostPSF ? primaryUseSF * primaryUseCostPSF : 0;
    const secondaryUseCost = secondaryUseRows.reduce((sum, u) => sum + (u.sf && u.costPSF ? u.sf * u.costPSF : 0), 0);
    const totalCost = f.totalProjectCost != null ? g("totalProjectCost")
      : (purchasePrice + primaryUseCost + secondaryUseCost + g("softCosts"));
    const loan = f.loan != null ? g("loan") : (f.loanLTC != null ? Math.round(totalCost * g("loanLTC")) : null);
    const equity = f.equity != null ? g("equity") : (loan != null ? totalCost - loan : null);
    const modelSourced = f.stabilizedNOI != null; // true when real model outputs are present

    let noi, exitValue, yieldOnCost;
    if (modelSourced) {
      noi = g("stabilizedNOI");
      exitValue = f.exitValue != null ? g("exitValue") : (g("exitCap") > 0 ? Math.round(noi / g("exitCap")) : null);
      yieldOnCost = f.yieldOnCost != null ? num("yieldOnCost") : (totalCost > 0 ? noi / totalCost : null);
    } else {
      // AI estimate fallback for properties without finalized model outputs —
      // a rough rent-roll NOI from the primary use plus any secondary use(s).
      const primaryRent = primaryUseSF && primaryUseRentPSF ? primaryUseSF * primaryUseRentPSF : 0;
      const secondaryRentEst = secondaryUseRows.reduce((sum, u) => {
        if (!u.sf || !u.rentPSF) return sum;
        // self-storage carries a heavier vacancy/expense load than a straight NNN rent roll
        const factor = /storage/i.test(u.label || "") ? 0.72 * 0.62 : 0.9;
        return sum + u.sf * u.rentPSF * factor;
      }, 0);
      const noiEst = primaryRent + g("groundLeaseAnnual") + secondaryRentEst;
      // no rent data at all (e.g. a land deal with no primary/secondary rent
      // set yet) — leave these null rather than a misleading "$0"/"0.0%"
      if (noiEst === 0) { noi = null; exitValue = null; yieldOnCost = null; }
      else {
        noi = noiEst;
        exitValue = g("exitCap") > 0 ? Math.round(noi / g("exitCap")) : null;
        yieldOnCost = totalCost > 0 ? noi / totalCost : null;
      }
    }

    /* ---- development-only metrics: canonical, legacy fallback ----
       Present only for ground-up / build-to-suit deals; absent on
       acquisitions, so the card hides these rows entirely instead of
       showing "—" for a metric that doesn't apply to this deal. */
    const developmentSpread = f.developmentSpread != null ? num("developmentSpread") : num("devSpread");
    const netDevelopmentProfit = f.netDevelopmentProfit != null ? num("netDevelopmentProfit") : num("devProfit");
    const isDevelopment = developmentSpread != null || netDevelopmentProfit != null;

    return {
      modelSourced, modelVersion: f.modelVersion || null, isDevelopment,
      purchasePrice, totalCost, loan, equity,
      loanLTC: num("loanLTC"), interestRate: num("interestRate"), exitCap: num("exitCap"), costOfSale: num("costOfSale"),
      primaryUseLabel, primaryUseSF, primaryUseRentPSF, primaryUseAreaUnit, primaryUseRentBasis,
      secondaryUseRows,
      softCosts: g("softCosts"),
      noi, exitValue, yieldOnCost,
      netSaleValue: num("netSaleValue"), developmentSpread, netDevelopmentProfit,
      profitMarginOnCost: num("profitMarginOnCost"),
      leveredIRR: num("leveredIRR"), equityMultiple: num("equityMultiple"), cashOnCash: num("cashOnCash"),
      dscr: num("dscr"), annualDebtService: num("annualDebtService"), loanBalanceExit: num("loanBalanceExit"),
      storageSensitivity: f.storageSensitivity || null,
      // legacy aliases — kept so anything still reading the old shape doesn't break
      landPrice: purchasePrice, retailSF: primaryUseSF, retailRentPSF: primaryUseRentPSF,
      devSpread: developmentSpread, devProfit: netDevelopmentProfit,
      noiEst: noi, exitValueEst: exitValue, yieldOnCostEst: yieldOnCost
    };
  }

  /* ---------- formatting helpers ---------- */
  const fmtUSD = (n, dec) => n == null ? "—" :
    "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: dec || 0 });
  const fmtUSDk = n => n == null ? "—" :
    (Math.abs(n) >= 1e6 ? "$" + (n / 1e6).toFixed(2) + "M"
      : Math.abs(n) >= 1e3 ? "$" + Math.round(n / 1e3) + "K" : "$" + n);
  const fmtPct = (n, dec) => n == null ? "—" : (n * 100).toFixed(dec == null ? 1 : dec) + "%";
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // A material/image `file` value is documented (schema/property-schema.mjs)
  // as "link/filename only" — either a full URL a human/Claude pasted in
  // (http(s)://..., or a root-relative /api/materials/... or /uploads/...
  // path), or just a bare filename with the implication that it lives at
  // /uploads/<propertyId>/<file> (the seed-file convention). Every place
  // that turns a `file` string into an actual href/src should go through
  // this, so a bare filename actually opens instead of 404ing against
  // whatever path happens to be in the address bar.
  function resolveFileUrl(propertyId, file) {
    if (!file) return "";
    if (/^(https?:|data:|\/)/i.test(file)) return file; // already absolute or root-relative
    return `/uploads/${encodeURIComponent(propertyId)}/${file}`;
  }

/* ============================================================
   Triangle Deal Pipeline — property data
   Properties are stored as JSON documents in Postgres, one row per
   property (see /db/schema.sql). This file no longer holds the data —
   to add or edit a property, use the Portfolio page's "Add Property"
   flow (copy the data-entry prompt, or paste/upload a JSON document)
   or a property card's "View/edit JSON" button. Nothing here needs
   hand-editing when a deal changes.
   ============================================================ */

/* ---------- API helpers ----------
   No client-side passcode handling anymore — the whole site sits behind
   the session-cookie gate (see lib/auth.mjs). The browser sends that
   cookie automatically; if it's missing/expired the API returns 401 and
   we just bounce to /login. ---------------------------------------- */
function redirectToLogin() { location.href = "/login"; }
async function apiListProperties() {
  const res = await fetch("/api/properties");
  if (res.status === 401) { redirectToLogin(); throw new Error("Session expired"); }
  if (!res.ok) throw new Error("Could not load properties (HTTP " + res.status + ")");
  return (await res.json()).properties || [];
}
async function apiGetProperty(id) {
  const res = await fetch("/api/properties/" + encodeURIComponent(id));
  if (res.status === 401) { redirectToLogin(); throw new Error("Session expired"); }
  if (res.status === 404) return null;
  if (!res.ok) throw new Error("Could not load property (HTTP " + res.status + ")");
  return (await res.json()).property;
}
async function apiValidateProperty(data) {
  const res = await fetch("/api/properties", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ data, validateOnly: true })
  });
  if (res.status === 401) { redirectToLogin(); throw new Error("Session expired"); }
  const body = await res.json().catch(() => ({}));
  return { httpOk: res.ok, status: res.status, ...body };
}
async function apiSaveProperty(data) {
  const res = await fetch("/api/properties", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ data })
  });
  if (res.status === 401) { redirectToLogin(); throw new Error("Session expired"); }
  const body = await res.json().catch(() => ({}));
  return { httpOk: res.ok, status: res.status, ...body };
}
async function apiSetArchived(id, archived) {
  const res = await fetch(`/api/properties/${encodeURIComponent(id)}/${archived ? "archive" : "unarchive"}`, { method: "POST" });
  if (res.status === 401) { redirectToLogin(); throw new Error("Session expired"); }
  const body = await res.json().catch(() => ({}));
  return { httpOk: res.ok, status: res.status, ...body };
}
async function apiDeleteProperty(id) {
  const res = await fetch("/api/properties/" + encodeURIComponent(id), { method: "DELETE" });
  if (res.status === 401) { redirectToLogin(); throw new Error("Session expired"); }
  const body = await res.json().catch(() => ({}));
  return { httpOk: res.ok, status: res.status, ...body };
}
const MAX_MATERIAL_FILE_BYTES = 3 * 1024 * 1024;
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",").pop()); // strip the "data:...;base64," prefix
    reader.onerror = () => reject(reader.error || new Error("Could not read file"));
    reader.readAsDataURL(file);
  });
}
async function apiUploadMaterial(propertyId, category, file) {
  if (file.size > MAX_MATERIAL_FILE_BYTES) {
    return { ok: false, error: `"${file.name}" is ${(file.size / 1024 / 1024).toFixed(1)}MB — max 3MB. For a bigger file, paste a link to where it already lives (Google Drive, Dropbox, etc.) via View/edit JSON instead.` };
  }
  const dataBase64 = await fileToBase64(file);
  const res = await fetch("/api/materials/" + encodeURIComponent(propertyId), {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ category, filename: file.name, contentType: file.type, dataBase64 })
  });
  if (res.status === 401) { redirectToLogin(); throw new Error("Session expired"); }
  const body = await res.json().catch(() => ({}));
  return { httpOk: res.ok, status: res.status, ...body };
}
// Same upload plumbing as apiUploadMaterial, but for a single named "hero"
// image (P.images.<imageKey>, e.g. "sitePlan") rather than an appended
// materials[category] entry — see routes/materials.js's `imageKey` branch.
async function apiUploadImage(propertyId, imageKey, file) {
  if (file.size > MAX_MATERIAL_FILE_BYTES) {
    return { ok: false, error: `"${file.name}" is ${(file.size / 1024 / 1024).toFixed(1)}MB — max 3MB. For a bigger file, paste a link to where it already lives (Google Drive, Dropbox, etc.) via View/edit JSON instead.` };
  }
  const dataBase64 = await fileToBase64(file);
  const res = await fetch("/api/materials/" + encodeURIComponent(propertyId), {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ imageKey, filename: file.name, contentType: file.type, dataBase64 })
  });
  if (res.status === 401) { redirectToLogin(); throw new Error("Session expired"); }
  const body = await res.json().catch(() => ({}));
  return { httpOk: res.ok, status: res.status, ...body };
}

/* ---------- shared: "View/edit JSON" modal (property page + preview) ---------- */
function openJsonModal(T, data, opts) {
  opts = opts || {};
  const readOnlyTitle = opts.title || "View / edit JSON";
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px";
  ov.innerHTML = `<div class="card" style="max-width:820px;width:100%;padding:20px;max-height:88vh;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 style="font-size:17px">${T.esc(readOnlyTitle)}</h2>
      <button class="btn btn-sm" id="jmClose" type="button">✕</button>
    </div>
    <div class="wnote" style="margin-bottom:8px">Raw JSON for this property. Copy or download it, or paste/upload a corrected version and save.</div>
    <textarea id="jmText" class="edit-input" style="flex:1;min-height:320px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">${T.esc(JSON.stringify(data, null, 2))}</textarea>
    <input type="file" id="jmFile" accept=".json,application/json" style="display:none">
    <div id="jmMsg" style="margin-top:8px"></div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center">
      <button class="btn" id="jmCopy" type="button">Copy</button>
      <button class="btn" id="jmUpload" type="button">Upload .json</button>
      <button class="btn" id="jmDownload" type="button">Download .json</button>
      <span style="flex:1"></span>
      <button class="btn btn-primary" id="jmSave" type="button">Save</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click", e => { if (e.target === ov) ov.remove(); });
  document.getElementById("jmClose").onclick = () => ov.remove();
  document.getElementById("jmCopy").onclick = () => {
    navigator.clipboard && navigator.clipboard.writeText(document.getElementById("jmText").value);
    const b = document.getElementById("jmCopy"); b.textContent = "Copied ✓"; setTimeout(() => b.textContent = "Copy", 1400);
  };
  document.getElementById("jmDownload").onclick = () => {
    const blob = new Blob([document.getElementById("jmText").value], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = (data.id || "property") + ".json"; a.click();
  };
  document.getElementById("jmUpload").onclick = () => document.getElementById("jmFile").click();
  document.getElementById("jmFile").onchange = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // allow picking the same file again later
    if (!file) return;
    const msg = document.getElementById("jmMsg");
    let text;
    try { text = await file.text(); }
    catch (err) { msg.innerHTML = `<div class="wnote" style="color:var(--bad-ink)">Could not read file: ${T.esc(err.message)}</div>`; return; }
    try { JSON.parse(text); }
    catch (err) { msg.innerHTML = `<div class="wnote" style="color:var(--bad-ink)">"${T.esc(file.name)}" is not valid JSON: ${T.esc(err.message)}</div>`; return; }
    document.getElementById("jmText").value = text;
    msg.innerHTML = `<div class="wnote" style="color:var(--ok-ink)">Loaded "${T.esc(file.name)}" — review below, then Save.</div>`;
  };
  document.getElementById("jmSave").onclick = async () => {
    const msg = document.getElementById("jmMsg");
    let parsed;
    try { parsed = JSON.parse(document.getElementById("jmText").value); }
    catch (e) { msg.innerHTML = `<div class="wnote" style="color:var(--bad-ink)">Not valid JSON: ${T.esc(e.message)}</div>`; return; }
    msg.innerHTML = `<div class="wnote">Saving…</div>`;
    const result = await apiSaveProperty(parsed).catch(err => ({ ok: false, error: err.message }));
    if (result.ok) {
      msg.innerHTML = `<div class="wnote" style="color:var(--ok-ink)">Saved ✓</div>`;
      if (opts.onSaved) opts.onSaved(parsed);
      setTimeout(() => ov.remove(), 500);
    } else if (result.errors) {
      msg.innerHTML = `<div class="wnote" style="color:var(--bad-ink)">Schema errors:<br>` +
        result.errors.map(e => T.esc(e.path + ": " + e.message)).join("<br>") + `</div>`;
    } else {
      msg.innerHTML = `<div class="wnote" style="color:var(--bad-ink)">${T.esc(result.error || "Save failed (" + result.status + ")")}</div>`;
    }
  };
}

/* ============ PORTFOLIO PAGE ============ */
async function initPortfolio(){
  const T = window.TRI;
  T.mountChrome("portfolio");
  document.getElementById("legend").innerHTML =
    `<span class="wnote" style="font-weight:700;margin-right:4px">Every fact on a card is tagged:</span>` + T.provLegend();

  const gridEl = document.getElementById("grid");
  gridEl.innerHTML = `<p class="wnote">Loading properties…</p>`;

  let props;
  try { props = await apiListProperties(); }
  catch (err) {
    gridEl.innerHTML = `<div class="card block"><p class="wnote">Could not load properties: ${T.esc(err.message)}.
      Check that <code>DATABASE_URL</code> is set and the <code>properties</code> table exists (see README).</p></div>`;
    return;
  }

  // enrich each with computed score + financing
  props.forEach(p => { p._score = T.computeScore(p.scores, p.dealType); p._fin = T.computeFinancing(p.financing); });

  // Archived properties are kept (fully intact, still openable/restorable/
  // deletable) and stay right on the portfolio grid — just sorted to the
  // bottom and shown a little grayed out — but they drop out of the KPIs
  // and the status filter chips, since those describe the active pipeline.
  const activeProps = props.filter(p => !p.archived);

  /* ----- KPIs (active properties only) ----- */
  const scored = activeProps.filter(p => p._score);
  const advancing = scored.filter(p => p._score.weighted >= 65).length;
  const avg = scored.length ? (scored.reduce((s, p) => s + p._score.weighted, 0) / scored.length).toFixed(1) : "—";
  const totalCost = activeProps.reduce((s, p) => s + (p._fin ? p._fin.totalCost : 0), 0);
  const kpis = [
    { v: activeProps.length, l: "Properties in pipeline", s: "active deals tracked" },
    { v: advancing + "/" + activeProps.length, l: "Advancing / keep-warm", s: "scored ≥ 65" },
    { v: avg, l: "Avg. weighted score", s: "of 100" },
    { v: T.fmtUSDk(totalCost), l: "Total project cost", s: "across modeled deals" }
  ];
  document.getElementById("kpis").innerHTML = kpis.map(k =>
    `<div class="kpi"><div class="v">${k.v}</div><div class="l">${k.l}</div><div class="s">${k.s}</div></div>`).join("");

  /* ----- status filter chips (active properties only — these don't apply to the archived view) ----- */
  const statuses = ["All"].concat([...new Set(activeProps.map(p => p.status).filter(Boolean))]);
  let activeStatus = "All", activeType = "All", query = "";
  const sf = document.getElementById("statusFilter");
  sf.innerHTML = statuses.map((s, i) =>
    `<button data-s="${T.esc(s)}" class="${i === 0 ? "on" : ""}">${T.esc(s)}</button>`).join("");
  sf.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    activeStatus = b.dataset.s;
    [...sf.children].forEach(c => c.classList.toggle("on", c === b));
    render();
  });

  /* ----- deal type filter chips ----- */
  const types = ["All"].concat(T.DEAL_TYPES);
  const tf = document.getElementById("typeFilter");
  tf.innerHTML = types.map((s, i) =>
    `<button data-s="${T.esc(s)}" class="${i === 0 ? "on" : ""}">${T.esc(s)}</button>`).join("");
  tf.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    activeType = b.dataset.s;
    [...tf.children].forEach(c => c.classList.toggle("on", c === b));
    render();
  });

  document.getElementById("q").addEventListener("input", e => { query = e.target.value.toLowerCase(); render(); });

  /* ----- card ----- */
  function card(p) {
    const sc = p._score, fin = p._fin;
    const badge = p.archived ? `<span class="badge badge-neutral">🗄 Archived</span>`
      : sc ? `<span class="badge ${sc.cls}">${sc.status}</span>`
      : `<span class="badge badge-neutral">Unscored</span>`;
    const scoreBox = sc
      ? `<div class="scorebig"><div class="n">${sc.weighted}</div><div class="m">/100 · ${T.provChip(p.scoreProvenance, true)}</div></div>`
      : `<div class="scorebig"><div class="n" style="color:var(--muted)">—</div><div class="m">not scored</div></div>`;
    const tags = (p.tags || []).slice(0, 3).map(t => `<span class="tag">${T.esc(t)}</span>`).join("");
    const purchase = fin ? T.fmtUSDk(fin.purchasePrice) : "—";
    const cost = fin ? T.fmtUSDk(fin.totalCost) : "—";
    const rent = fin && fin.primaryUseRentPSF ? "$" + fin.primaryUseRentPSF + "/SF" : "—";
    return `<a class="card pcard" href="#/p/${encodeURIComponent(p.id)}"${p.archived ? ' style="opacity:.7;filter:grayscale(.4)"' : ""}>
      <div class="top">
        <div class="row">
          <div><h3>${T.esc(p.name)}</h3><div class="addr">${T.esc(p.county)} · ${T.esc(p.parcels || "")}</div></div>
          ${scoreBox}
        </div>
      </div>
      <div class="mid">
        <div class="row" style="margin-bottom:4px">${badge}<span class="wnote">${T.esc(p.status || "")}</span><span class="type-chip">${T.esc(p.dealType || "Property-Driven")}</span></div>
        <div class="tags">${tags}</div>
      </div>
      <div class="foot">
        <div class="mini">
          <span class="b">Price<b class="money">${purchase}</b></span>
          <span class="b">Project<b class="money">${cost}</b></span>
          <span class="b">Rent<b class="money">${rent}</b></span>
        </div>
        <span class="wnote">Open →</span>
      </div>
    </a>`;
  }

  function render() {
    const list = props.filter(p => {
      // status/type chips describe the active pipeline — an archived
      // property still shows under "All" (search always finds it), just
      // sorted to the bottom below, so it never vanishes entirely.
      if (!p.archived) {
        if (activeStatus !== "All" && p.status !== activeStatus) return false;
        if (activeType !== "All" && (p.dealType || "Property-Driven") !== activeType) return false;
      } else if (activeStatus !== "All" || activeType !== "All") {
        return false;
      }
      if (!query) return true;
      const hay = [p.name, p.county, p.address, (p.tags || []).join(" "), p.headlineTenant && p.headlineTenant.name].join(" ").toLowerCase();
      return hay.includes(query);
    }).sort((a, b) => (a.archived ? 1 : 0) - (b.archived ? 1 : 0));
    gridEl.innerHTML = list.map(card).join("") +
      `<a class="addtile" href="#/add"><span class="plus">＋</span><b>Add a property</b>
       <span class="wnote">Copy the data-entry prompt, or upload a JSON card</span></a>`;
  }
  render();
}

      ? `<a class="btn btn-sm" href="${T.esc(T.resolveFileUrl(P.id, finModelFile.file))}" target="_blank" rel="noopener">Open financing model ↗</a>`

    const railFin = fin ? `<section class="card block">
      <div class="section-title" style="margin-bottom:10px">Deal Economics ${chip(finProv)}</div>
      <div class="fin-hi">
        <div class="t big"><div class="l">${fin.isDevelopment ? "Land basis" : "Purchase price / basis"}</div><div class="v">${T.fmtUSD(fin.purchasePrice)}</div></div>
        <div class="t"><div class="l">Total project</div><div class="v">${T.fmtUSDk(fin.totalCost)}</div></div>
        ${fin.primaryUseRentPSF ? `<div class="t"><div class="l">${T.esc(fin.primaryUseLabel || "Primary use")} rent</div><div class="v">$${fin.primaryUseRentPSF}<small>${T.esc(fin.primaryUseRentBasis)}</small></div></div>` : ""}
        <div class="t"><div class="l">Est. sale · Yr5</div><div class="v">${T.fmtUSDk(fin.exitValue)}</div></div>

    const rail = `<aside class="prail">${railScore}${railFin}</aside>`;

    /* ---------- main sections ---------- */
    const flagTypeOpts = t => ["opp", "risk", "watch"].map(k =>

    const flagLine = (f, i) => EDIT ? `<li class="${f.type || "watch"}"><span class="mk">${f.type === "opp" ? "▲" : f.type === "risk" ? "■" : "◆"}</span>

          <select class="edit-prov" data-path="flags.${i}.type" style="width:130px">${flagTypeOpts(f.type)}</select>
          <input class="edit-input" data-path="flags.${i}.text" value="${T.esc(f.text)}">
          <select class="edit-prov" data-path="flags.${i}.s">${provOpts(f.s)}</select>
        </span></li>`
      : `<li class="${f.type || "watch"}"><span class="mk">${f.type === "opp" ? "▲" : f.type === "risk" ? "■" : "◆"}</span><span>${T.esc(f.text)} ${chip(f.s)}</span></li>`;
    const snapshot = `<section class="card block" id="snapshot">
      <h2><span class="block-icon">◱</span>Investment Snapshot</h2>
      ${EDIT ? `<textarea class="edit-input" data-path="thesis.v" rows="4">${T.esc(P.thesis && P.thesis.v)}</textarea><select class="edit-prov" data-path="thesis.s" style="margin-bottom:12px">${provOpts(P.thesis && P.thesis.s)}</select>`
        : (P.thesis ? `<p style="font-size:15px;margin:6px 0 16px">${T.esc(P.thesis.v)} ${chip(P.thesis.s)}</p>` : `<p class="wnote">Needs input.</p>`)}

      <ul class="flags">${(P.flags || []).map((f, i) => flagLine(f, i)).join("")}</ul>
    </section>`;

    // Same "real control if there's something to open/replace, upload
    // prompt otherwise" pattern as the financing model button above —
    // works identically the first time a property gets a site plan (right
    // after Add Property lands on this same card) and every time after.
    const sitePlanUrl = P.images && P.images.sitePlan ? T.resolveFileUrl(P.id, P.images.sitePlan) : "";
    const sitePlanUpload = `<label class="btn btn-sm" style="cursor:pointer">＋ ${sitePlanUrl ? "Replace" : "Upload"} site plan image<input type="file" accept="image/*,.svg" data-img-key="sitePlan" style="display:none"></label>`;
    const sitePlan = (sitePlanUrl || EDIT) ? `<section class="card block" id="siteplan">
      <h2><span class="block-icon">▦</span>Concept Site Plan</h2>
      <div class="hint">Conceptual test-fit — not an engineered plan. ${chip("ai")}</div>
      ${sitePlanUrl ? `<div class="frame"><img src="${T.esc(sitePlanUrl)}" alt="Concept site plan"></div>` : `<div class="dropzone">No site plan image yet — upload one below</div>`}
      ${EDIT ? `<div style="margin-top:10px">${sitePlanUpload}</div>` : ""}
    </section>` : "";

    const tenants = (P.tenants && P.tenants.length) ? `<section class="card block" id="tenants">
      <h2><span class="block-icon">☰</span>Potential Tenants</h2>
      <div class="hint">Who fills the buildings — and how solid they are.</div>
      ${P.tenants.map((t, i) => { const logo = t.logo ? `<img src="${T.esc(t.logo)}" alt="${T.esc(t.name)}">` : `<div class="ic" style="width:30px;height:30px;border-radius:7px;background:var(--brand-wash);color:var(--brand-dark);display:grid;place-items:center;font-weight:800">☰</div>`;
        return EDIT ? `<div class="tenant" style="align-items:flex-start">${logo}
          <div class="grow" style="display:flex;flex-direction:column;gap:5px">
            <input class="edit-input" data-path="tenants.${i}.name" value="${T.esc(t.name)}" placeholder="Tenant name">
            <input class="edit-input" data-path="tenants.${i}.status" value="${T.esc(t.status || "")}" placeholder="Status label (e.g. Interested — anchor)">
            <textarea class="edit-input" rows="2" data-path="tenants.${i}.note">${T.esc(t.note)}</textarea>
            <select class="edit-prov" data-path="tenants.${i}.s">${provOpts(t.s)}</select>
          </div></div>`
          : `<div class="tenant">${logo}<div class="grow"><div class="tn">${T.esc(t.name)} <span class="badge ${t.cls || "badge-neutral"}" style="font-size:11px">${T.esc(t.status || "")}</span></div><div class="td">${T.esc(t.note)} ${chip(t.s)}</div></div></div>`;
      }).join("")}
    </section>` : "";

    const surr = (P.surroundings && P.surroundings.items && P.surroundings.items.length) ? `<section class="card block" id="surroundings">
      <h2><span class="block-icon">◎</span>Surroundings & Adjacencies</h2>
      <div class="hint">Neighboring uses and what they mean for this deal. ${EDIT ? `<select class="edit-prov" data-path="surroundings.s">${provOpts(P.surroundings.s)}</select>` : chip(P.surroundings.s)}</div>
      <ul class="flags">${P.surroundings.items.map((s, i) => EDIT ? `<li class="${s.type || "watch"}"><span class="mk">${s.type === "opp" ? "▲" : "◆"}</span>
          <span style="flex:1;display:flex;flex-direction:column;gap:5px">
            <span style="display:flex;gap:8px">
              <select class="edit-prov" data-path="surroundings.items.${i}.type" style="width:120px"><option value="opp" ${s.type === "opp" ? "selected" : ""}>Opportunity</option><option value="watch" ${s.type === "watch" ? "selected" : ""}>Watch</option></select>

            <textarea class="edit-input" rows="2" data-path="surroundings.items.${i}.note">${T.esc(s.note)}</textarea>
          </span></li>`
        : `<li class="${s.type || "watch"}"><span class="mk">${s.type === "opp" ? "▲" : "◆"}</span><span><b>${T.esc(s.name)}</b>${s.rel ? " — " + T.esc(s.rel) : ""}<br><span class="wnote">${T.esc(s.note)}</span></span></li>`).join("")}</ul>
    </section>` : "";

    const history = (P.history && P.history.bullets && P.history.bullets.length) ? `<section class="card block" id="history">
      <h2><span class="block-icon">◷</span>Property History & Notable Findings</h2>
      <div class="fields">${P.history.bullets.map((b, i) => EDIT
        ? `<div class="f is-editing"><div class="k">${T.esc(b.t)}</div><div class="val"><textarea class="edit-input" rows="2" data-path="history.bullets.${i}.d">${T.esc(b.d)}</textarea><select class="edit-prov" data-path="history.bullets.${i}.s">${provOpts(b.s)}</select></div></div>`
        : `<div class="f"><div class="k">${T.esc(b.t)}</div><div class="val">${T.esc(b.d)} ${chip(b.s)}</div></div>`).join("")}</div>
    </section>` : "";

    const contacts = (P.contacts && P.contacts.length) ? `<section class="card block" id="contacts">
      <h2><span class="block-icon">✉</span>Brokers, Owners & Contacts</h2>
      <div class="duo">${P.contacts.map((c, i) => EDIT ? `<div style="border:1px solid var(--brand);border-radius:11px;padding:13px 15px">
          <div style="display:flex;gap:8px;margin-bottom:6px"><input class="edit-input" data-path="contacts.${i}.role" value="${T.esc(c.role || "")}" placeholder="Role"><select class="edit-prov" data-path="contacts.${i}.s">${provOpts(c.s)}</select></div>
          <input class="edit-input" style="margin-bottom:6px" data-path="contacts.${i}.name" value="${T.esc(c.name || "")}" placeholder="Name">
          <input class="edit-input" style="margin-bottom:6px" data-path="contacts.${i}.org" value="${T.esc(c.org || "")}" placeholder="Organization">
          <input class="edit-input" style="margin-bottom:6px" data-path="contacts.${i}.detail" value="${T.esc(c.detail || "")}" placeholder="Detail (phone / email)">

        </div>` : `<div style="border:1px solid var(--line);border-radius:11px;padding:13px 15px">
        <div class="section-title">${T.esc(c.role || "")} ${chip(c.s)}</div>
        <div style="font-weight:750;margin-top:4px">${T.esc(c.name)}</div><div class="wnote" style="color:var(--ink-2)">${T.esc(c.org)}</div>
        <div class="wnote" style="margin-top:6px">${T.esc(c.detail)}</div><div class="wnote" style="margin-top:6px;color:var(--ink-2)">${T.esc(c.bg)}</div></div>`).join("")}</div>
    </section>` : "";

    /* ---------- financing detail (model outputs — figures only, edit via View/edit JSON) ---------- */
    const sens = fin && fin.storageSensitivity ? `<div style="margin-top:14px">
      <div class="section-title" style="margin-bottom:6px">Storage-rent sensitivity ${chip("source")}</div>
      <table class="fintable"><tr><td>Storage rent ($/SF)</td>${fin.storageSensitivity.map(r => `<td>$${r.rent}</td>`).join("")}</tr>
        <tr><td>Yield on cost</td>${fin.storageSensitivity.map(r => `<td>${T.fmtPct(r.yoc)}</td>`).join("")}</tr>
        <tr><td>Dev. spread</td>${fin.storageSensitivity.map(r => `<td style="color:${r.spread < 0 ? "var(--bad-ink)" : "var(--ok-ink)"}">${(r.spread * 100).toFixed(1)}%</td>`).join("")}</tr></table>
      </div>` : "";
    const pencilFact = P.financingNote && P.financingNote.pencil;
    const pencil = pencilFact ? (() => {
      const ok = pencilFact.ok;
      const border = ok === true ? "var(--ok)" : ok === false ? "var(--bad)" : "var(--muted)";
      const bg = ok === true ? "var(--ok-bg)" : ok === false ? "var(--bad-bg)" : "var(--line-2)";
      const heading = ok === true ? "✓ Pencils" : ok === false ? "⚑ Does not currently pencil" : "◐ Pencil status not set";
      return `<div class="extra" style="border-left-color:${border};background:${bg};margin:0 0 14px"><div class="lab">${heading}</div><div class="txt">${T.esc(pencilFact.v)} ${chip(pencilFact.s)}</div></div>`;
    })() : "";
    const listask = P.financingNote && P.financingNote.listAsk ? `<div class="extra" style="border-left-color:var(--p-need);background:var(--p-need-bg);margin-top:14px"><div class="lab">⚑ Price to reconcile</div><div class="txt">${T.esc(P.financingNote.listAsk.v)} ${chip(P.financingNote.listAsk.s)}</div></div>` : "";

    /* data-driven use rows — a use only renders when it actually has an area or a rent, never "0 SF @ $0/SF" */
    const useRow = (label, sf, areaUnit, rentPSF, rentBasis, costPSF) => {
      if (!label || (!sf && !rentPSF && !costPSF)) return "";
      const parts = [];
      if (sf) parts.push(`${sf.toLocaleString()} ${areaUnit || "SF"}`);
      if (rentPSF) parts.push(`$${rentPSF}${rentBasis || "/SF"}`);
      if (costPSF) parts.push(`$${costPSF}/SF cost`);
      return `<tr><td>${T.esc(label)}</td><td>${parts.join(" · ")}</td></tr>`;
    };
    const useRows = fin ? useRow(fin.primaryUseLabel, fin.primaryUseSF, fin.primaryUseAreaUnit, fin.primaryUseRentPSF, fin.primaryUseRentBasis) +
      (fin.secondaryUseRows || []).map(u => useRow(u.label, u.sf, u.areaUnit, u.rentPSF, u.rentBasis, u.costPSF)).join("") : "";

    /* development-only rows — only when the underlying keys are actually present */
    const devSpreadRow = fin && fin.developmentSpread != null
      ? `<tr><td>Development spread</td><td style="color:${fin.developmentSpread < 0 ? "var(--bad-ink)" : "var(--ok-ink)"}">${(fin.developmentSpread * 100).toFixed(1)}%</td></tr>` : "";
    const devProfitRow = fin && fin.netDevelopmentProfit != null
      ? `<tr><td>Net development profit</td><td style="color:${fin.netDevelopmentProfit < 0 ? "var(--bad-ink)" : "var(--ok-ink)"}">${T.fmtUSD(fin.netDevelopmentProfit)}</td></tr>` : "";

    const finDetail = fin ? `<section class="card block" id="financing">
      <h2><span class="block-icon">$</span>F · Deal Economics & Financing</h2>
      <div class="hint">${fin.modelVersion ? T.esc(fin.modelVersion) + " — figures below are from the model." : "From the financing model."}</div>
      ${pencil}
      <div class="fin-hi">
        <div class="t big"><div class="l">${fin.isDevelopment ? "Land basis" : "Purchase price / basis"}</div><div class="v">${T.fmtUSD(fin.purchasePrice)} ${chip("source")}</div></div>
        <div class="t"><div class="l">Total project cost</div><div class="v">${T.fmtUSD(fin.totalCost)}</div></div>
        <div class="t"><div class="l">Est. sale price · Yr5</div><div class="v">${T.fmtUSDk(fin.exitValue)} ${chip(finProv)}</div></div>
      </div>
      <div class="duo">
        <div><div class="section-title" style="margin:4px 0 8px">Model inputs ${chip("source")}</div>
          <table class="fintable">
            ${useRows}
            <tr><td>Soft costs</td><td>${T.fmtUSD(fin.softCosts)}</td></tr>
            <tr><td>Loan / equity (${T.fmtPct(fin.loanLTC, 0)} LTC)</td><td>${T.fmtUSD(fin.loan)} / ${T.fmtUSD(fin.equity)}</td></tr>
            <tr><td>Interest · amort · hold</td><td>${T.fmtPct(fin.interestRate, 2)} · ${P.financing.amortYears || "—"}yr · ${P.financing.holdYears || "—"}yr</td></tr>
            <tr><td>Exit cap · cost of sale</td><td>${T.fmtPct(fin.exitCap, 2)} · ${T.fmtPct(fin.costOfSale, 1)}</td></tr>
          </table></div>
        <div><div class="section-title" style="margin:4px 0 8px">Returns (stabilized) ${chip(finProv)}</div>
          <table class="fintable">
            <tr><td>Stabilized NOI</td><td>${T.fmtUSD(fin.noi)}</td></tr>
            <tr><td>Exit value @ ${T.fmtPct(fin.exitCap, 1)}</td><td>${T.fmtUSD(fin.exitValue)}</td></tr>
            <tr><td>Yield on cost</td><td>${T.fmtPct(fin.yieldOnCost)}</td></tr>
            ${devSpreadRow}
            <tr><td>Levered IRR · equity multiple</td><td style="color:${fin.leveredIRR < 0 ? "var(--bad-ink)" : "var(--ink)"}">${fin.leveredIRR != null ? T.fmtPct(fin.leveredIRR) : "—"} · ${fin.equityMultiple != null ? fin.equityMultiple.toFixed(2) + "×" : "—"}</td></tr>
            <tr><td>Cash-on-cash · DSCR</td><td>${fin.cashOnCash != null ? T.fmtPct(fin.cashOnCash) : "—"} · ${fin.dscr != null ? fin.dscr.toFixed(2) : "—"}</td></tr>
            ${devProfitRow}
          </table></div>
      </div>
      ${sens}
      ${listask}
    </section>` : "";

    /* ---------- checklist ---------- */
    const stMap = { done: ["st-done", "✓"], prog: ["st-prog", "◐"], none: ["st-none", "·"], flag: ["st-flag", "!"] };
    const checklistSections = T.checklistTemplateFor(dealType);
    const checklistRange = checklistSections.length ? `${checklistSections[0].id}–${checklistSections[checklistSections.length - 1].id}` : "";
    const checklist = (P.checklist) ? `<section class="card block" id="checklist">
      <h2><span class="block-icon">☑</span>Development Checklist (${checklistRange})</h2>
      <div class="hint">The full ${T.esc(dealType).toLowerCase()} development checklist, tracked per item.
        <span class="badge badge-ok" style="font-size:11px">✓ done</span> <span class="badge badge-warn" style="font-size:11px">◐ in progress</span>
        <span class="badge badge-bad" style="font-size:11px">! flag</span> <span class="badge badge-neutral" style="font-size:11px">· not started</span></div>
      <div class="check">${checklistSections.map(sec => `<div class="chk-cat">${sec.id}. ${T.esc(sec.title)}</div>` +
        (P.checklist[sec.id] || []).map((r, idx) => { const st = stMap[r.status] || stMap.none;
          if (!EDIT) return `<div class="ci"><span class="st ${st[0]}">${st[1]}</span><span class="lab">${T.esc(r.item)}<span class="rsp">${T.esc(r.response || "")}${r.note ? " · " + T.esc(r.note) : ""}</span></span><span>${chip(r.s)}</span></div>`;
          const path = `checklist.${sec.id}.${idx}`;
          return `<div class="ci" style="grid-template-columns:56px 1fr 100px;align-items:start">
            <select class="edit-prov" data-path="${path}.status" style="width:56px;padding:2px">
              <option value="done" ${r.status === "done" ? "selected" : ""}>✓</option>
              <option value="prog" ${r.status === "prog" ? "selected" : ""}>◐</option>
              <option value="none" ${r.status === "none" ? "selected" : ""}>·</option>
              <option value="flag" ${r.status === "flag" ? "selected" : ""}>!</option>
            </select>
            <span style="display:flex;flex-direction:column;gap:4px">
              <b style="font-size:13.5px">${T.esc(r.item)}</b>
              <input class="edit-input" data-path="${path}.response" value="${T.esc(r.response || "")}" placeholder="Response">
              <input class="edit-note" data-path="${path}.note" value="${T.esc(r.note || "")}" placeholder="Note (optional)">
            </span>
            <select class="edit-prov" data-path="${path}.s">${provOpts(r.s)}</select>
          </div>`; }).join("")).join("")}</div>
    </section>` : "";

    const matData = P.materials || {};
    const materials = `<section class="card block" id="materials">
      <h2><span class="block-icon">📎</span>Deal Materials</h2>
      <div class="hint">Every uploaded file, grouped by type — multiple files per category are supported. Upload directly below (max 3MB/file), or link to somewhere the file already lives (Google Drive, Dropbox, etc.) via View/edit JSON.</div>
      ${T.MATERIAL_CATEGORIES.map(cat => { const files = (matData[cat.id] || []);
        return `<div class="matcat"><h4><span class="block-icon" style="width:22px;height:22px;font-size:12px">${cat.icon}</span>${T.esc(cat.label)} <span class="wnote">(${files.length})</span></h4>
          <div class="filelist">${files.length ? files.map(f => `<a class="fileitem" href="${T.esc(T.resolveFileUrl(P.id, f.file) || "#")}" target="_blank" rel="noopener"><span class="ic">${((f.name || "?").split(".").pop() || "?").slice(0, 4).toUpperCase()}</span><span class="grow"><b>${T.esc(f.name)}</b><br><span class="meta">${T.esc(f.meta || "")}</span></span>${chip(f.s)}</a>`).join("") : `<div class="dropzone">No files yet — upload one below</div>`}</div>
          <label class="btn btn-sm" style="margin-top:8px;cursor:pointer">＋ Upload file<input type="file" data-mat-cat="${cat.id}" style="display:none"></label>
        </div>`; }).join("")}
    </section>`;

    const extras = (P.extras && P.extras.length) ? `<section class="card block" id="extras">
      <h2><span class="block-icon">＋</span>Additional Captured Information</h2>
      <div class="hint">Details that arrived outside the standard template — kept here so nothing gets lost.</div>
      ${P.extras.map((e, i) => EDIT ? `<div class="extra">
          <div style="display:flex;gap:8px;margin-bottom:6px"><input class="edit-input" data-path="extras.${i}.label" value="${T.esc(e.label || "")}" placeholder="Label" style="font-weight:750"><select class="edit-prov" data-path="extras.${i}.s">${provOpts(e.s)}</select></div>
          <textarea class="edit-input" rows="2" data-path="extras.${i}.text">${T.esc(e.text)}</textarea>
        </div>` : `<div class="extra"><div class="lab">${T.esc(e.label)} ${chip(e.s)}</div><div class="txt">${T.esc(e.text)}</div></div>`).join("")}
    </section>` : "";

    const sources = (P.sources && P.sources.length) ? `<section class="card block" id="sources">
      <h2><span class="block-icon">§</span>Sources</h2><ol class="srclist">${P.sources.map((s, i) => EDIT
        ? `<li style="margin-bottom:6px"><input class="edit-input" data-path="sources.${i}.label" value="${T.esc(s.label || "")}"></li>`
        : `<li><a href="${T.esc(s.url || "#")}" target="_blank" rel="noopener">${T.esc(s.label || s.url)}</a></li>`).join("")}</ol>
    </section>` : "";

    const mainCol = `<div class="pmain">
      ${snapshot}${sitePlan}
      ${fieldBlock("propinfo", "A · Property Information", "◱", "The basics of the parcel and the deal.", "propertyInfo")}
      ${fieldBlock("gis", "GIS Information", "◈", "Parcel, buildings, easements and assessed value from county GIS + survey.", "gis")}
      ${fieldBlock("market", "B · Market & Location Analysis", "◎", "Traffic, corridor strength, demographics and growth.", "market")}
      ${fieldBlock("zoning", "E · Zoning & Entitlement", "⚖", "Current zoning, the rezoning path, and approval risk.", "zoning")}
      ${contacts}${history}${surr}${tenants}
      ${fieldBlock("hbu", "C · Highest & Best Use / Phasing", "▤", "The development concept and how it phases.", "hbu")}
      ${finDetail}${checklist}${materials}${extras}${sources}

    const legend = `<div class="card" style="padding:11px 16px;margin:6px 0 14px" id="legendbar"><div class="prov-legend"><span class="wnote" style="font-weight:700">Source markers:</span>${T.provLegend()}</div></div>`;

    /* ---------- print tearsheet (the "Save as PDF (1-pager)" button) ----------
       The .tearsheet CSS above has always existed, but nothing ever built

       same score/fin/P data the full card already computed above. */
    const tsBadge = score ? `<span class="badge ${score.cls}">${score.status}</span>` : `<span class="badge badge-neutral">Unscored</span>`;
    const tsScorebar = score ? `<div class="ts-scorebar">
        <div class="ts-bar"><div class="ts-mark" style="left:${score.weighted}%"></div></div>
        <div class="ts-scale"><span>Pass</span><span>Keep Warm</span><span>Advance</span></div>
      </div>` : "";
    const tsFintiles = fin ? `<div class="ts-fintiles">
        <div class="ts-tile"><div class="l">${T.esc(fin.isDevelopment ? "Land basis" : "Purchase price")}</div><div class="v">${T.fmtUSD(fin.purchasePrice)}</div></div>
        <div class="ts-tile"><div class="l">Total cost</div><div class="v">${T.fmtUSDk(fin.totalCost)}</div></div>
        <div class="ts-tile"><div class="l">Yield on cost</div><div class="v">${T.fmtPct(fin.yieldOnCost)}</div></div>
        <div class="ts-tile"><div class="l">Exit value</div><div class="v">${T.fmtUSDk(fin.exitValue)}</div></div>
        <div class="ts-tile"><div class="l">Levered IRR</div><div class="v">${fin.leveredIRR != null ? T.fmtPct(fin.leveredIRR) : "TBD"}</div></div>
      </div>` : "";
    const tsKeyFacts = [].concat(P.propertyInfo || [], P.market || [], P.zoning || []).slice(0, 6);
    const tsEconRows = fin ? `
        <div class="tsr"><span class="tsk">Loan / Equity</span><span class="tsv">${T.fmtUSD(fin.loan)} / ${T.fmtUSD(fin.equity)}</span></div>
        <div class="tsr"><span class="tsk">Interest · amort · hold</span><span class="tsv">${T.fmtPct(fin.interestRate, 2)} · ${(P.financing && P.financing.amortYears) || "—"}yr · ${(P.financing && P.financing.holdYears) || "—"}yr</span></div>
        <div class="tsr"><span class="tsk">Exit cap · cost of sale</span><span class="tsv">${T.fmtPct(fin.exitCap, 2)} · ${T.fmtPct(fin.costOfSale, 1)}</span></div>
        <div class="tsr"><span class="tsk">Stabilized NOI</span><span class="tsv">${T.fmtUSD(fin.noi)}</span></div>`
      : `<div class="tsr"><span class="tsk">Not yet modeled</span><span class="tsv">—</span></div>`;
    const tsFlags = (P.flags && P.flags.length) ? `<div class="ts-flags">
        <div class="ts-h">Flags</div>
        <div class="tsflags-grid">${P.flags.slice(0, 6).map(f => `<div class="tsflag ${f.type || "watch"}"><span>${f.type === "opp" ? "▲" : f.type === "risk" ? "■" : "◆"}</span><span>${T.esc(f.text)}</span></div>`).join("")}</div>
      </div>` : "";
    const tearsheet = `<div class="tearsheet">
      <div class="ts-head">
        <div class="ts-logo" style="background:var(--brand-ink);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:800;font-size:15px">TIG</div>
        <div class="ts-title">
          <div class="ts-kicker">Triangle Investment Group · Deal Summary</div>
          <h1>${T.esc(P.name)}</h1>
          <div class="ts-addr">${T.esc(P.address || "")}${P.county ? " · " + T.esc(P.county) : ""}</div>
        </div>
        <div class="ts-meta">
          ${tsBadge}
          <div class="ts-mrow"><b>Deal type</b><span>${T.esc(dealType)}</span></div>
          <div class="ts-mrow"><b>Stage</b><span>${T.esc(P.status || "—")}</span></div>
          <div class="ts-mrow"><b>Parcels</b><span>${T.esc(P.parcels || "—")}</span></div>
          <div class="ts-mrow"><b>Updated</b><span>${T.esc(P.updated || "—")}</span></div>
        </div>
      </div>

      ${P.thesis && P.thesis.v ? `<div class="ts-thesis">${T.esc(P.thesis.v)}</div>` : ""}
      <div class="ts-cols">
        <div>
          <div class="ts-h">Key Facts</div>
          ${tsKeyFacts.length ? tsKeyFacts.map(r => `<div class="tsr"><span class="tsk">${T.esc(r.k)}</span><span class="tsv">${T.esc(r.d && r.d.v)}</span></div>`).join("") : `<div class="tsr"><span class="tsk">No details captured yet</span><span class="tsv">—</span></div>`}
        </div>
        <div>
          <div class="ts-h">Deal Economics</div>
          ${tsEconRows}
        </div>
      </div>
      ${tsFlags}
      <div class="ts-foot">
        <div class="prov-legend">${T.provLegend()}</div>
        <div class="ts-disc">Triangle Investment Group — internal &amp; confidential. Figures are estimates based on current assumptions; not a substitute for the underlying model, survey, or counsel.</div>
      </div>
    </div>`;

    app.innerHTML = `<div class="screen-only">${header}${toc}${legend}<div class="player">${mainCol}${rail}</div></div>${tearsheet}`;
    document.body.classList.toggle("editing", EDIT);
    wire();
  }

  /* ---------- events ---------- */
  function markDirty() { dirty = true; const b = document.querySelector(".edit-badge"); if (b && !b.querySelector(".dirty-dot")) b.innerHTML = 'Editing <span class="dirty-dot"></span>'; }

  async function doSave() {
    const btn = document.getElementById("btnSave");
    if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
    const result = await apiSaveProperty(P).catch(err => ({ ok: false, error: err.message }));
    if (result.ok) {
      baseSnapshot = clone(P);
      dirty = false; EDIT = false;
      saveMsg = { ok: true, text: "Saved ✓ — visible to everyone now." };
      render();
      setTimeout(() => { saveMsg = null; render(); }, 4000);
    } else {
      if (btn) { btn.disabled = false; btn.textContent = "Save"; }
      saveMsg = result.errors
        ? { ok: false, text: "Doesn't match the schema: " + result.errors.map(e => e.path + ": " + e.message).join("; ") }
        : { ok: false, text: result.error || "Save failed — try again." };
      render();
    }
  }

  async function doArchiveToggle() {
    const archiving = !P.archived;
    const btn = document.getElementById("btnArchive");
    if (btn) { btn.disabled = true; btn.textContent = archiving ? "Archiving…" : "Restoring…"; }
    const result = await apiSetArchived(P.id, archiving).catch(err => ({ ok: false, error: err.message }));
    if (result.ok) {
      P = result.property; baseSnapshot = clone(P);
      saveMsg = { ok: true, text: archiving
        ? "Archived ✓ — no longer shown in the active pipeline. Restore any time."
        : "Restored ✓ — back in the active pipeline." };
      render();
      setTimeout(() => { saveMsg = null; render(); }, 4000);
    } else {
      if (btn) { btn.disabled = false; btn.textContent = archiving ? "🗄 Archive" : "↩ Restore"; }
      saveMsg = { ok: false, text: result.error || "Couldn't update — try again." };
      render();
    }
  }

  async function doDelete() {
    if (!confirm(`Permanently delete "${P.name}"? This deletes the property card for everyone and cannot be undone. If you just want it out of the active pipeline but kept for reference, use Archive instead.`)) return;
    const btn = document.getElementById("btnDelete");
    if (btn) { btn.disabled = true; btn.textContent = "Deleting…"; }
    const result = await apiDeleteProperty(P.id).catch(err => ({ ok: false, error: err.message }));
    if (result.ok) {
      location.hash = "#/";
    } else {
      if (btn) { btn.disabled = false; btn.textContent = "🗑 Delete"; }
      saveMsg = { ok: false, text: result.error || "Delete failed — try again." };
      render();
    }
  }

  async function doUploadMaterial(category, file) {
    saveMsg = { ok: true, text: `Uploading "${file.name}"…` };
    render();
    const result = await apiUploadMaterial(P.id, category, file).catch(err => ({ ok: false, error: err.message }));
    if (result.ok) {
      P = result.property; baseSnapshot = clone(P);
      saveMsg = { ok: true, text: `Uploaded "${file.name}" ✓` };
      render();
      setTimeout(() => { saveMsg = null; render(); }, 4000);
    } else {
      saveMsg = { ok: false, text: result.error || `Couldn't upload "${file.name}" — try again.` };
      render();
    }
  }

  async function doUploadImage(imageKey, file) {
    saveMsg = { ok: true, text: `Uploading "${file.name}"…` };
    render();
    const result = await apiUploadImage(P.id, imageKey, file).catch(err => ({ ok: false, error: err.message }));
    if (result.ok) {
      P = result.property; baseSnapshot = clone(P);
      saveMsg = { ok: true, text: `Uploaded "${file.name}" ✓` };
      render();
      setTimeout(() => { saveMsg = null; render(); }, 4000);
    } else {
      saveMsg = { ok: false, text: result.error || `Couldn't upload "${file.name}" — try again.` };
      render();
    }
  }

  function wire() {
    const g = id => document.getElementById(id);
    if (g("btnJson")) g("btnJson").onclick = () => openJsonModal(T, P, {
      title: P.name + " — raw JSON",
      onSaved: updated => { P = updated; baseSnapshot = clone(P); EDIT = false; dirty = false; render(); }
    });
    if (g("btnJsonFromEdit")) g("btnJsonFromEdit").onclick = (e) => { e.preventDefault(); openJsonModal(T, P, {
      title: P.name + " — raw JSON",
      onSaved: updated => { P = updated; baseSnapshot = clone(P); EDIT = false; dirty = false; render(); }
    }); };
    if (g("btnEdit")) g("btnEdit").onclick = () => { baseSnapshot = clone(P); EDIT = true; dirty = false; saveMsg = null; render(); };
    if (g("btnCancel")) g("btnCancel").onclick = () => {
      if (dirty && !confirm("Discard your unsaved changes?")) return;
      P = clone(baseSnapshot); EDIT = false; dirty = false; saveMsg = null; render();
    };
    if (g("btnSave")) g("btnSave").onclick = doSave;
    if (g("btnArchive")) g("btnArchive").onclick = doArchiveToggle;
    if (g("btnDelete")) g("btnDelete").onclick = doDelete;
    document.querySelectorAll("input[data-mat-cat]").forEach(input => {
      input.onchange = () => {
        const file = input.files && input.files[0];
        input.value = "";
        if (file) doUploadMaterial(input.dataset.matCat, file);
      };
    });
    document.querySelectorAll("input[data-img-key]").forEach(input => {
      input.onchange = () => {
        const file = input.files && input.files[0];
        input.value = "";
        if (file) doUploadImage(input.dataset.imgKey, file);
      };
    });
    // bind editable inputs
    document.querySelectorAll("[data-path]").forEach(el => {
      const isScore = el.classList.contains("editscore");
      const isDealType = el.dataset.path === "dealType";
      el.addEventListener(isScore || isDealType ? "change" : "input", () => {
        let v = el.value;
        if (isScore) { v = Math.max(0, Math.min(5, parseInt(v, 10) || 0)); }
        else if (el.dataset.type === "tags") { v = v.split(",").map(s => s.trim()).filter(Boolean); }
        setPath(P, el.dataset.path, v);
        markDirty();
        if (isScore || isDealType) render(); // refresh gauge + meter (and checklist/scorecard on type switch)
      });
    });
  }

  render();
}

/* ============ ADD A PROPERTY (copy prompt + upload JSON) ============ */
function initAdd(){
  const T = window.TRI;
  T.mountChrome();
  document.getElementById("legend2").innerHTML = T.provLegend();
  const $ = id => document.getElementById(id);

  /* ---- step 1: copy the data-entry prompt ---- */
  async function fetchPromptText() {
    const res = await fetch("/prompt/data-entry-prompt.md");
    if (!res.ok) throw new Error("Could not load the prompt (HTTP " + res.status + ")");
    return await res.text();
  }
  $("copyPromptBtn").onclick = async () => {
    const btn = $("copyPromptBtn");
    try {
      const text = await fetchPromptText();
      navigator.clipboard && await navigator.clipboard.writeText(text);
      btn.textContent = "Copied ✓"; setTimeout(() => btn.textContent = "Copy data-entry prompt", 1600);
    } catch (e) {
      btn.textContent = "Couldn't copy — see link below"; setTimeout(() => btn.textContent = "Copy data-entry prompt", 2200);
    }
  };

  /* ---- step 2: paste / upload JSON ---- */
  let currentData = null;

  function setStatus(html) { $("uploadStatus").innerHTML = html; }
  function setPreview(html) { $("uploadPreview").innerHTML = html; }

  function renderPreview(preview) {
    const sc = preview.scores ? T.computeScore(preview.scores, preview.dealType) : null;
    setPreview(`<div class="card block" style="margin-top:14px">
      <div class="section-title" style="margin-bottom:8px">Preview</div>
      <div style="display:flex;flex-wrap:wrap;gap:22px;align-items:baseline">
        <div><div class="wnote">Name</div><div style="font-weight:750;font-size:15px">${T.esc(preview.name)}</div></div>
        <div><div class="wnote">Score</div><div style="font-weight:750">${sc ? sc.weighted + "/100 · " + sc.status : "Not scored"}</div></div>
        <div><div class="wnote">Purchase price / basis</div><div style="font-weight:750">${T.fmtUSD(preview.purchasePrice)}</div></div>
        <div><div class="wnote">Total project cost</div><div style="font-weight:750">${T.fmtUSDk(preview.totalProjectCost)}</div></div>
        <div><div class="wnote">Yield on cost</div><div style="font-weight:750">${preview.yieldOnCost != null ? T.fmtPct(preview.yieldOnCost) : "—"}</div></div>
      </div>
    </div>`);
  }

  async function validateCurrent() {
    setPreview("");
    let parsed;
    try { parsed = JSON.parse($("jsonInput").value); }
    catch (e) { setStatus(`<div class="wnote" style="color:var(--bad-ink)">Not valid JSON: ${T.esc(e.message)}</div>`); currentData = null; return; }
    setStatus(`<div class="wnote">Validating…</div>`);
    const result = await apiValidateProperty(parsed).catch(err => ({ ok: false, error: err.message }));
    if (result.ok) {
      currentData = parsed;
      setStatus(`<div class="wnote" style="color:var(--ok-ink)">Looks good — matches the schema.</div>`);
      renderPreview(result.preview);
    } else if (result.errors) {
      currentData = null;
      setStatus(`<div class="wnote" style="color:var(--bad-ink)">Doesn't match the schema yet:<br>` +
        result.errors.map(e => T.esc(e.path + ": " + e.message)).join("<br>") + `</div>`);
    } else {
      currentData = null;
      setStatus(`<div class="wnote" style="color:var(--bad-ink)">${T.esc(result.error || "Validation failed")}</div>`);
    }
  }

  $("jsonInput").addEventListener("input", () => { clearTimeout(window._validTimer); window._validTimer = setTimeout(validateCurrent, 400); });
  $("jsonFile").addEventListener("change", () => {
    const f = $("jsonFile").files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => { $("jsonInput").value = reader.result; validateCurrent(); };
    reader.readAsText(f);
  });

  $("saveBtn").onclick = async () => {
    if (!currentData) { setStatus(`<div class="wnote" style="color:var(--bad-ink)">Fix the validation errors above before saving.</div>`); return; }
    setStatus(`<div class="wnote">Saving…</div>`);
    const result = await apiSaveProperty(currentData).catch(err => ({ ok: false, error: err.message }));
    if (result.ok) {
      setStatus(`<div class="wnote" style="color:var(--ok-ink)">Saved ✓ — opening the card…</div>`);
      setTimeout(() => { location.hash = "#/p/" + encodeURIComponent(result.id); }, 500);
    } else if (result.errors) {
      setStatus(`<div class="wnote" style="color:var(--bad-ink)">Doesn't match the schema:<br>` +
        result.errors.map(e => T.esc(e.path + ": " + e.message)).join("<br>") + `</div>`);
    } else {
      setStatus(`<div class="wnote" style="color:var(--bad-ink)">${T.esc(result.error || "Save failed (" + result.status + ")")}</div>`);
    }
  };
}

function route(){
  const h=location.hash||'#/';
  if(h[0]==='#' && h.indexOf('#/')!==0) return; // in-page TOC anchor — let the browser scroll, don't re-render
  const v=document.getElementById('view');window.scrollTo(0,0);
  if(h.indexOf('#/p/')===0){window.CURRENT_ID=decodeURIComponent(h.slice(4));v.innerHTML='<div id="app"></div>';initProperty();}
  else if(h==='#/add'){v.innerHTML=ADD_SKELETON;initAdd();}
  else {v.innerHTML=PF_SKELETON;initPortfolio();}
}
